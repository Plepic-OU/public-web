<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Retired page. GitHub Pages serves static files only, so there is no
       redirect layer and a true 301 is not available. An instant meta refresh
       is the substitute: Google reads it as a redirect and consolidates the
       signals onto /training/, more slowly than a 301 would. -->
  <meta http-equiv="refresh" content="0;url=/training/">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://plepic.com/training/">

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.google.com https://i.ytimg.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.google.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Page moved | Plepic</title>
</head>
<body>
  <p>This page has moved. Go to <a href="/training/">the Plepic training program</a>.</p>
</body>
</html>
