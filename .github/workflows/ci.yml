name: ci

on:
  pull_request:
    branches: [main]

# Job ids below (lint, tests, claims) are the required status checks on main.
# Renaming a job or adding a `name:` field changes the check context and
# silently unblocks — or permanently blocks — merges. Keep the ids exact.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Deterministic suites only. tests/visual.spec.ts (macOS-generated
      # snapshot baselines) and tests/metamorphosis.spec.ts (needs WebGL)
      # fail permanently on a Linux runner and stay local-only. Never
      # switch this to bare `npm test`.
      - run: npx playwright test tests/design-guard.spec.ts tests/a11y.spec.ts tests/security.spec.ts

  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-claims.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
