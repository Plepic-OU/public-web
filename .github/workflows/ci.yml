name: ci

on:
  pull_request:
    branches: [main]

# Job ids below (lint, tests, claims) are the required status checks on main.
# Renaming a job or adding a `name:` field changes the check context and
# silently unblocks — or permanently blocks — merges. Keep the ids exact.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit ratchet reads package.json and package-lock.json from
          # origin/<base>, so the whole history has to be here.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Dependency advisories, as a ratchet rather than a bar: main already
      # carries 16 high and 1 critical, so --audit-level=high would fail every
      # PR from the first run. A STEP inside lint, not a job of its own — a new
      # job id changes the check context and lands outside branch protection.
      # `bash …` because a file added through the contents API is mode 100644.
      - run: bash scripts/audit-ratchet.sh
        env:
          BASE_REF: ${{ github.base_ref }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Deterministic suites only. tests/visual.spec.ts (macOS-generated
      # snapshot baselines) and tests/metamorphosis.spec.ts (needs WebGL)
      # fail permanently on a Linux runner and stay local-only. Never
      # switch this to bare `npm test`.
      - run: npx playwright test tests/design-guard.spec.ts tests/a11y.spec.ts tests/security.spec.ts

  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-claims.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
