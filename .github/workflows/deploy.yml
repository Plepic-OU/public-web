name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Belt and braces for auto-merge. GitHub suppresses workflow runs for pushes
  # attributed to GITHUB_TOKEN, and auto-merge.yml arms auto-merge with exactly
  # that token — so the push above may never fire when a PR merges itself, and
  # a merged change would sit undeployed. This trigger fires on the merge event
  # instead of the push, which nothing suppresses. A human merge fires both; the
  # pages concurrency group serialises them and the second is a harmless no-op.
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A closed PR that was never merged changed nothing, so it must not deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always main, whatever the trigger. On a pull_request event the
          # default would be the PR's merge ref; pinning main also means a
          # hand-run workflow_dispatch cannot put a branch on plepic.com.
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove orphan files from deploy
        run: |
          # Internal-only / prototype / build-tooling files that should not
          # be publicly reachable on plepic.com. Keep this list in sync with
          # repo hygiene; if a file here gets a real public role, remove
          # it from this list rather than working around the deploy.
          rm -rf _archive playwright-report tests
          rm -f  design-system.html font-compare.html demo-tenders.html
          rm -f  claims-receipts.log scripts/check-claims.mjs
          rm -rf docs/training-one-pager
          rm -rf docs/specs

      - name: Cache-bust asset URLs
        # Stamp a content hash onto css/js URLs in the HTML so returning
        # visitors get fresh assets after a deploy instead of a stale copy
        # (GitHub Pages serves max-age=600). Runs on the artifact only; the
        # committed source stays clean. Unchanged assets keep their hash and
        # stay cached; only changed files bust.
        run: node scripts/cache-bust.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
